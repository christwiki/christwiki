# The editorial outline: every event the first version of Christwiki covers.
#
# `npm run seed` turns each line into a stub entry, together with stubs for the
# people and places it names. Researchers then replace the stubs with finished,
# cited entries. Fields:
#
#   id, title            the event's slug and heading
#   year, end            signed years (negative = BC); omit both when conf is undated
#   month, day, circa    optional refinements
#   display              optional label that overrides the generated date
#   conf                 firm | estimated | traditional | undated
#   order                tiebreak inside one year
#   places, people       ids; the first place is the primary one
#   threads, follows     storylines and the events this one grows out of
#   key                  where a researcher should start: the main primary sources
#
# Dates here are starting points. The finished entry's date and its dating note
# are what count.

